name: Build and Publish

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: docker.io/bobcatrobotics/vscodium-web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Verify tag belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "This tag does not point to a commit on main"
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Build and push arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.aarch64
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ github.ref_name }}" \
            "${{ env.IMAGE_NAME }}:${{ github.ref_name }}-amd64" \
            "${{ env.IMAGE_NAME }}:${{ github.ref_name }}-arm64"

          docker buildx imagetools inspect \
            "${{ env.IMAGE_NAME }}:${{ github.ref_name }}"